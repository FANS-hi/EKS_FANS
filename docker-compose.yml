services:
  # ================================
  # 데이터베이스
  # ================================

  # PostgreSQL Database Server (Port: 5432)
  postgres:
    image: postgres:15
    container_name: fans_postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fans_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fans_user} -d ${POSTGRES_DB:-fans_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ================================
  # AI 서비스들
  # ================================

  # AI Summarization Service (Port: 8000)
  summarize-ai:
    build: ./backend/ai/summarize-ai
    container_name: fans_summarize_ai
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - PORT=${SUMMARIZE_AI_PORT:-8000}
      - MODEL_NAME=${MODEL_NAME}
      - MAX_SUMMARY_LENGTH=${MAX_SUMMARY_LENGTH}
    networks:
      - fans_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ================================
  # 편향 분석 AI 서비스
  # ================================

  # AI Bias Analysis Service (Port: 8002)
  bias-analysis-ai:
    build: ./backend/ai/bias-analysis-ai
    container_name: fans_bias_analysis_ai
    expose:
      - "8002"
    env_file:
      - .env
    environment:
      - PORT=${BIAS_ANALYSIS_AI_PORT:-8002}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fans_network
    volumes:
      - ./backend/ai/bias-analysis-ai:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ================================
  # 크롤러 서비스들
  # ================================

  # Unified Crawler v2 (다음 + 네이버 통합) - Port: 4005
  crawler-v2:
    build:
      context: ./backend/crawler
      dockerfile: ./crawler-v2/Dockerfile
    container_name: fans_crawler_v2
    expose:
      - "4005"
    env_file:
      - .env
    environment:
      - UNIFIED_CRAWLER_PORT=4005
      - AUTO_CRAWL=true
      - CRAWL_INTERVAL_MINUTES=5
      - CRAWL_LIMIT_PER_SECTION=20
    depends_on:
      postgres:
        condition: service_healthy
      bias-analysis-ai:
        condition: service_healthy
    networks:
      - fans_network
    shm_size: '2gb'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

