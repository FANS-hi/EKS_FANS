  # ================================
  # 메인 API 서비스
  # ================================

  # Main Backend API (Port: 3000)
  main-api:
    build: ./backend/api
    container_name: fans_main_api
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      summarize-ai:
        condition: service_healthy
      crawler-v2:
        condition: service_started
    networks:
      - fans_network
    volumes:
      - ./backend/api:/app
      - /app/node_modules
      - ./backend/api/uploads:/app/uploads
    restart: unless-stopped

  # ================================
  # 프론트엔드
  # ================================

  # React Frontend (Port: 3001)
  frontend:
    build: ./frontend
    container_name: fans_frontend
    expose:
      - "3001"
    env_file:
      - .env
    environment:
      - REACT_APP_API_BASE=${REACT_APP_API_BASE}
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_AI_SERVICE_URL=${REACT_APP_AI_SERVICE_URL}
      - PORT=3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - fans_network
    depends_on:
      - main-api
    restart: unless-stopped

  # ================================
  # Nginx Reverse Proxy (Port: 80, 443)
  # ================================
  nginx:
    image: nginx:alpine
    container_name: fans_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend/nginx/ssl:/etc/nginx/ssl:ro
      - ./backend/nginx/logs:/var/log/nginx
    networks:
      - fans_network
    depends_on:
      - main-api
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  fans_network:
    driver: bridge
