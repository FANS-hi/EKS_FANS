apiVersion: v1
kind: ConfigMap
metadata:
  name: fans-config
  namespace: fans
data:
  # Database
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "fans_db"
  DB_USER: "team1"

  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # AI Services
  SUMMARIZE_AI_URL: "http://summarize-ai-service:8000"
  BIAS_ANALYSIS_AI_URL: "http://bias-analysis-ai-service:8002"

  # Node Environment
  NODE_ENV: "production"

  # Frontend
  REACT_APP_API_URL: "http://api-service:3000"
