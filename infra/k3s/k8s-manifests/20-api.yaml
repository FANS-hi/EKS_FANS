apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-api
  namespace: fans
  labels:
    app: main-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-api
  template:
    metadata:
      labels:
        app: main-api
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: api
        image: hodduk/k3s-fans-api:latest
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: fans-config
        - secretRef:
            name: fans-secrets
        env:
        - name: PORT
          value: "3000"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: fans
spec:
  selector:
    app: main-api
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
