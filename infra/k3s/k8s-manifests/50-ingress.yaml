apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fans-ingress
  namespace: fans
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: fans.example.com  # 실제 도메인으로 변경
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80

---
# NodePort Service (Ingress 없이 직접 접속용)
apiVersion: v1
kind: Service
metadata:
  name: frontend-nodeport
  namespace: fans
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: api-nodeport
  namespace: fans
spec:
  type: NodePort
  selector:
    app: main-api
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000
    protocol: TCP
