apiVersion: v1
kind: Secret
metadata:
  name: fans-secrets
  namespace: fans
type: Opaque
stringData:
  # Database Password (base64로 인코딩하지 않고 평문으로 입력)
  DB_PASSWORD: "your-db-password-here"

  # JWT Secret
  JWT_SECRET: "your-jwt-secret-here"

  # Session Secret
  SESSION_SECRET: "your-session-secret-here"

  # Kakao OAuth
  KAKAO_CLIENT_ID: ""
  KAKAO_CLIENT_SECRET: ""
  KAKAO_REDIRECT_URI: ""

  # Naver OAuth
  NAVER_CLIENT_ID: ""
  NAVER_CLIENT_SECRET: ""
  NAVER_REDIRECT_URI: ""

  # AWS SES (Email)
  AWS_SES_REGION: "ap-northeast-2"
  AWS_SES_ACCESS_KEY_ID: ""
  AWS_SES_SECRET_ACCESS_KEY: ""
  AWS_SES_FROM_EMAIL: ""

---
# PostgreSQL 초기 비밀번호
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: fans
type: Opaque
stringData:
  POSTGRES_USER: "team1"
  POSTGRES_PASSWORD: "your-db-password-here"
  POSTGRES_DB: "fans_db"
