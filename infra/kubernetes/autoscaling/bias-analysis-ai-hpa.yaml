# FANS Bias Analysis AI - Horizontal Pod Autoscaler
# 편향 분석 AI 자동 스케일링

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bias-analysis-ai-hpa
  namespace: fans
  labels:
    app: bias-analysis-ai
    tier: ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bias-analysis-ai
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # 10분 안정화
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
