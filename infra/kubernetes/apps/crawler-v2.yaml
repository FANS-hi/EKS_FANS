# FANS Crawler v2
# Unified crawler (Daum + Naver) - Port 4005
# 5분마다 자동 크롤링 (섹션당 20개)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler-v2
  namespace: fans
  labels:
    app: crawler-v2
    tier: crawler
    project: FANS
spec:
  replicas: 1  # 크롤러 활성화
  selector:
    matchLabels:
      app: crawler-v2
  template:
    metadata:
      labels:
        app: crawler-v2
        tier: crawler
    spec:
      containers:
      - name: crawler-v2
        image: 907123164281.dkr.ecr.ap-northeast-2.amazonaws.com/eks-fans/crawler-v2:latest
        ports:
        - containerPort: 4005
          name: http
          protocol: TCP

        env:
        - name: UNIFIED_CRAWLER_PORT
          value: "4005"
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          value: "postgresql://fans_admin:$(DB_PASSWORD)@eks-fans-postgres.cz884ewuuhlv.ap-northeast-2.rds.amazonaws.com:5432/fans_db"
        - name: DB_HOST
          value: "eks-fans-postgres.cz884ewuuhlv.ap-northeast-2.rds.amazonaws.com"
        - name: DB_PORT
          value: "5432"
        - name: DB_USERNAME
          value: "fans_admin"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fans-secret
              key: DB_PASSWORD
        - name: DB_NAME
          value: "fans_db"
        - name: PGSSLMODE
          value: "no-verify"
        - name: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
          value: "true"
        - name: PUPPETEER_EXECUTABLE_PATH
          value: "/usr/bin/chromium-browser"
        - name: AUTO_CRAWL
          value: "true"
        - name: CRAWL_INTERVAL_MINUTES
          value: "5"
        - name: CRAWL_LIMIT_PER_SECTION
          value: "20"

        resources:
          requests:
            cpu: 300m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi

        livenessProbe:
          httpGet:
            path: /health
            port: 4005
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 4005
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: crawler-v2
  namespace: fans
  labels:
    app: crawler-v2
spec:
  type: ClusterIP
  ports:
  - port: 4005
    targetPort: 4005
    protocol: TCP
    name: http
  selector:
    app: crawler-v2
