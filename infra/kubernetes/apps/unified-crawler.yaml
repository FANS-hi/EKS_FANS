# FANS Unified Crawler
# Unified crawler (Daum + Naver) - Port 4005
# 30분마다 자동 크롤링 (섹션당 10개)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-crawler
  namespace: fans
  labels:
    app: unified-crawler
    tier: crawler
    project: FANS
spec:
  replicas: 1  # 크롤러 활성화
  selector:
    matchLabels:
      app: unified-crawler
  template:
    metadata:
      labels:
        app: unified-crawler
        tier: crawler
    spec:
      containers:
      - name: unified-crawler
        image: 907123164281.dkr.ecr.ap-northeast-2.amazonaws.com/fans/unified-crawler:latest
        ports:
        - containerPort: 4005
          name: http
          protocol: TCP

        env:
        - name: TZ
          value: "Asia/Seoul"
        - name: UNIFIED_CRAWLER_PORT
          value: "4005"
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          value: "postgresql://fans_admin:$(DB_PASSWORD)@eks-fans-postgres.cz884ewuuhlv.ap-northeast-2.rds.amazonaws.com:5432/fans_db"
        - name: DB_HOST
          value: "eks-fans-postgres.cz884ewuuhlv.ap-northeast-2.rds.amazonaws.com"
        - name: DB_PORT
          value: "5432"
        - name: DB_USERNAME
          value: "fans_admin"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fans-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          value: "fans_db"
        - name: PGSSLMODE
          value: "no-verify"
        - name: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
          value: "true"
        - name: PUPPETEER_EXECUTABLE_PATH
          value: "/usr/bin/chromium-browser"
        - name: AUTO_CRAWL
          value: "true"
        - name: CRAWL_INTERVAL_MINUTES
          value: "30"
        - name: CRAWL_LIMIT_PER_SECTION
          value: "10"
        - name: TYPEORM_SYNC
          value: "true"

        # SQS 설정 (AI 작업 큐 전송)
        - name: USE_SQS
          value: "true"  # true로 설정하면 AI 직접 호출 대신 SQS 사용
        - name: SQS_SUMMARIZE_QUEUE_URL
          value: "https://sqs.ap-northeast-2.amazonaws.com/907123164281/fans-ai-summarize-queue"
        - name: SQS_BIAS_QUEUE_URL
          value: "https://sqs.ap-northeast-2.amazonaws.com/907123164281/fans-ai-bias-queue"
        - name: AWS_REGION
          value: "ap-northeast-2"

        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi

        livenessProbe:
          httpGet:
            path: /health
            port: 4005
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 4005
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: unified-crawler
  namespace: fans
  labels:
    app: unified-crawler
spec:
  type: ClusterIP
  ports:
  - port: 4005
    targetPort: 4005
    protocol: TCP
    name: http
  selector:
    app: unified-crawler
